<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ログイン</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: linear-gradient(135deg, #1E3A8A 0%, #2B5BA8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      padding: 48px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 90%;
    }
    h1 {
      text-align: center;
      color: #1E3A8A;
      margin-bottom: 32px;
      font-size: 22px;
    }
    .form-group { margin-bottom: 24px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #333;
      font-size: 14px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 6px;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #1E3A8A;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #FF7A00;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #E66A00; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      color: #FF4444;
      background: #FFE5E5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>管理者ログイン</h1>
    <div id="error" class="error"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" required autofocus>
      </div>
      <button type="submit" id="submit-btn">ログイン</button>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'ログイン中...';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const result = await res.json();
        if (result.success) {
          window.location.href = '/admin/dashboard';
        } else {
          errorDiv.textContent = result.error || 'ログインに失敗しました';
          errorDiv.style.display = 'block';
        }
      } catch {
        errorDiv.textContent = 'サーバーエラーが発生しました';
        errorDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'ログイン';
      }
    });
  </script>
</body>
</html>
